name: Workflow regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ai_rewriter.py config.py main.py safe_http.py
      - run: php -l wordpress-plugin/ms-news-workflow/ms-news-workflow.php
      - run: php tests/plugin_test.php
