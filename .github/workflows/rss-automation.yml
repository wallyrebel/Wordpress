name: RSS to WordPress Automation

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview locally in run artifacts without publishing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ms-news-publishing
  cancel-in-progress: false

jobs:
  publish-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested dependencies
        run: pip install -r requirements.lock
      - name: Run offline regression checks
        run: python -m unittest discover -s tests -v
      - name: Restore legacy database and local cache
        uses: actions/cache/restore@v4
        with:
          path: processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            processed-db-
      - name: Process feeds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PUBLISH_MODE: auto
          EXTRACTION_MODEL: gpt-5-nano
          DRAFTING_MODEL: gpt-5.6-luna
          CATEGORY_IDS_JSON: ${{ vars.CATEGORY_IDS_JSON || '{}' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '30' }}
          MAX_RUN_SECONDS: ${{ vars.MAX_RUN_SECONDS || '600' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi
      - name: Save local cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Show feed coverage and held-item reasons
        if: always()
        run: python scripts/run_report.py
      - name: Upload review queue and run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review/
            rss_automation.log
          retention-days: 14
