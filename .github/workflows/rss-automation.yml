name: RSS to WordPress Automation

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Authenticated read-only coverage reconciliation and editorial/image previews'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ms-news-publishing
  cancel-in-progress: false

jobs:
  publish-articles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Read-only until the first authenticated preview is reviewed.
      PUBLISHER_LIVE: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested dependencies
        run: pip install -r requirements.lock
      - name: Run offline regression checks
        run: python -m unittest discover -s tests -v
      - name: Restore legacy database and local cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            processed-db-
      - name: Process feeds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PUBLISH_MODE: auto
          EXTRACTION_MODEL: gpt-6-luna
          DRAFTING_MODEL: gpt-6-luna
          DAILY_ARTICLE_GOAL: '5'
          MAX_NEW_POSTS_PER_RUN: '2'
          CATEGORY_IDS_JSON: ${{ vars.CATEGORY_IDS_JSON || '{}' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '8' }}
          MAX_ENTRIES_PER_FEED: ${{ vars.MAX_ENTRIES_PER_FEED || '3' }}
          MAX_RUN_SECONDS: ${{ vars.MAX_RUN_SECONDS || '600' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ] || [ "$PUBLISHER_LIVE" != "true" ]; then
            python main.py --authenticated-preview
          else
            python main.py
          fi
      - name: Save local cache
        if: always() && inputs.dry_run != true && env.PUBLISHER_LIVE == 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Show feed coverage and held-item reasons
        if: always()
        run: python scripts/run_report.py
      - name: Upload review queue and run summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: news-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            review/
            images/
            rss_automation.log
          retention-days: 14
