name: RSS repair authenticated preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rss-repair-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-news-publishing
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - name: Authenticated reconciliation and at most eight editorial pipelines; no writes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          EXTRACTION_MODEL: gpt-6-luna
          DRAFTING_MODEL: gpt-6-luna
          DAILY_ARTICLE_GOAL: '5'
          CATEGORY_IDS_JSON: ${{ vars.CATEGORY_IDS_JSON || '{}' }}
        run: python main.py --authenticated-preview --max-items 8
      - name: Report exact result and any blocker
        if: always()
        run: python scripts/run_report.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rss-repair-preview-${{ github.run_id }}
          path: |
            review/
            images/
            rss_automation.log
          retention-days: 14
